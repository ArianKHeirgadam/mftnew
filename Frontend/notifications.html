<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اعلان‌ها | سامانه سنجش</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="assets/css/dark.css">
<style>
  .notif-item{display:flex;gap:14px;padding:16px;border-radius:var(--r-md);transition:.2s;position:relative;}
  .notif-item:hover{background:var(--surface-2);}
  .notif-item.unread{background:color-mix(in srgb, var(--primary) 5%, transparent);}
  .notif-item.unread::before{content:'';position:absolute;top:20px;right:6px;width:7px;height:7px;border-radius:99px;background:var(--primary);}
  .notif-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
</style>
</head>
<body data-role="student" data-active="notifications">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-col">
    <div id="topbar-root" data-title="اعلان‌ها"></div>
    <main class="content fade-in">
      <div class="page-head">
        <div>
          <div class="breadcrumb">سامانه سنجش <span>/</span> <b>اعلان‌ها</b></div>
          <h1>مرکز اعلان‌ها</h1>
        </div>
        <button class="btn btn-outline" data-notification-read-all>علامت‌گذاری همه به‌عنوان خوانده‌شده</button>
      </div>

      <div class="tabs" data-tabs>
        <button class="tab-btn active" data-tab="tAll">همه (۰)</button>
        <button class="tab-btn" data-tab="tUnread">خوانده‌نشده (۰)</button>
        <button class="tab-btn" data-tab="tRead">خوانده‌شده (۰)</button>
      </div>

      <div class="card card-pad">
        <div id="tAll" class="tab-panel active" data-notification-list>
          <div class="text-soft" style="padding:24px;text-align:center">در حال دریافت اعلان‌ها...</div>
        </div>
        <div id="tUnread" class="tab-panel"><div class="text-soft" style="padding:24px;text-align:center">در حال دریافت اعلان‌ها...</div></div>
        <div id="tRead" class="tab-panel"><div class="text-soft" style="padding:24px;text-align:center">در حال دریافت اعلان‌ها...</div></div>
