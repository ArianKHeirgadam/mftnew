<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اعلان‌ها | سامانه سنجش</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="assets/css/dark.css">
<style>
  .notif-item{display:flex;gap:14px;padding:16px;border-radius:var(--r-md);transition:.2s;position:relative;}
  .notif-item:hover{background:var(--surface-2);}
  .notif-item.unread{background:color-mix(in srgb, var(--primary) 5%, transparent);}
  .notif-item.unread::before{content:'';position:absolute;top:20px;right:6px;width:7px;height:7px;border-radius:99px;background:var(--primary);}
  .notif-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
</style>
</head>
<body data-role="student" data-active="notifications">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-col">
    <div id="topbar-root" data-title="اعلان‌ها"></div>
    <main class="content fade-in">
      <div class="page-head">
        <div>
          <div class="breadcrumb">سامانه سنجش <span>/</span> <b>اعلان‌ها</b></div>
          <h1>مرکز اعلان‌ها</h1>
        </div>
        <button class="btn btn-outline" data-notification-read-all>علامت‌گذاری همه به‌عنوان خوانده‌شده</button>
      </div>

      <section class="card card-pad mt-24" data-notification-compose hidden>
        <div class="section-title"><h3>ثبت اعلان جدید</h3><span class="text-soft text-sm">ویژه مدیر کل</span></div>
        <div class="grid-2" style="margin-top:12px">
          <div class="field"><label for="notificationAudience">گیرندگان</label>
            <select class="input" id="notificationAudience" data-notification-audience>
              <option value="Department">تمام اعضای یک دپارتمان</option>
              <option value="Managers">تمام مدیران دپارتمان</option>
              <option value="User">یک کاربر مشخص</option>
              <option value="Class">اعضای یک کلاس</option>
            </select>
          </div>
          <div class="field" data-notification-department-wrap><label for="notificationDepartment">دپارتمان مقصد</label><select class="input" id="notificationDepartment" data-notification-department><option value="">در حال دریافت...</option></select></div>
          <div class="field" data-notification-user-wrap hidden><label for="notificationUser">کاربر مقصد</label><select class="input" id="notificationUser" data-notification-user><option value="">در حال دریافت...</option></select></div>
        </div>
        <div class="field" data-notification-class-wrap hidden>
          <label for="notificationClass">کلاس مقصد</label>
          <select class="input" id="notificationClass" data-notification-class><option value="">در حال دریافت...</option></select>
          <p class="text-soft text-sm" data-class-summary></p>
          <div class="field" data-class-roster-wrap hidden>
            <label for="classRosterMembers">اعضای کلاس (برای ویرایش، اعضای موردنظر را انتخاب کنید)</label>
            <select class="input" id="classRosterMembers" data-class-roster-members multiple size="6"></select>
            <button class="btn btn-outline mt-8" type="button" data-class-roster-save>ذخیره اعضای کلاس</button>
          </div>
        </div>
        <div class="grid-2" data-class-create-wrap hidden>
          <div class="field"><label for="newClassName">نام کلاس جدید</label><input class="input" id="newClassName" data-class-name maxlength="200" placeholder="مثلاً کلاس برنامه‌نویسی وب"></div>
          <div class="field"><label for="newClassDepartment">دپارتمان کلاس</label><select class="input" id="newClassDepartment" data-class-department><option value="">انتخاب دپارتمان</option></select></div>
          <div class="field"><label for="newClassMembers">اعضای کلاس (دانشجویان همان دپارتمان)</label><select class="input" id="newClassMembers" data-class-members multiple size="5"></select><small class="text-soft">برای انتخاب چند نفر، Ctrl را نگه دارید.</small></div>
          <div class="field" style="align-self:end;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-outline" type="button" data-class-create>ایجاد کلاس و ثبت اعضا</button><button class="btn btn-primary" type="button" data-class-save-members>ذخیره اعضای کلاس انتخاب‌شده</button></div>
        </div>
        <div class="field"><label for="notificationTitle">عنوان اعلان</label><input class="input" id="notificationTitle" maxlength="250" data-notification-title placeholder="عنوان اعلان"></div>
        <div class="field"><label for="notificationMessage">متن اعلان</label><textarea class="input" id="notificationMessage" rows="4" data-notification-message placeholder="متن اعلان را بنویسید..."></textarea></div>
        
        <button class="btn btn-primary" type="button" data-notification-send>ارسال اعلان</button>
      </section>

      <div class="tabs" data-tabs>
        <button class="tab-btn active" data-tab="tAll">همه (۰)</button>
        <button class="tab-btn" data-tab="tUnread">خوانده‌نشده (۰)</button>
        <button class="tab-btn" data-tab="tRead">خوانده‌شده (۰)</button>
      </div>

      <div class="card card-pad">
        <div id="tAll" class="tab-panel active" data-notification-list data-notification-panel><div class="empty-state">در حال دریافت اعلان‌ها...</div></div>
        <div id="tUnread" class="tab-panel" data-notification-panel></div>
        <div id="tRead" class="tab-panel" data-notification-panel></div>
      </div>
    </main>
  </div>
</div>
<script src="assets/js/theme.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/api.js"></script>
</body>
</html>
