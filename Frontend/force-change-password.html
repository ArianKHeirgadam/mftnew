<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تغییر رمز موقت | سامانه آزمون</title>
  <link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css"><link rel="stylesheet" href="assets/css/dark.css">
</head>
<body data-active="force-password">
  <main class="login-shell"><section class="card" style="width:min(520px,100%);padding:32px;margin:auto">
    <h1>تعیین رمز عبور جدید</h1>
    <p>این حساب با رمز موقت ساخته شده است. برای ادامه، یک رمز جدید با حداقل ۸ کاراکتر تعیین کنید.</p>
    <form id="forcePasswordForm">
      <div class="field"><label for="newPassword">رمز جدید</label><input class="input" id="newPassword" type="password" minlength="8" autocomplete="new-password" required></div>
      <div class="field"><label for="confirmPassword">تکرار رمز جدید</label><input class="input" id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div>
      <button class="btn btn-primary btn-block" type="submit">ثبت رمز جدید و ورود</button>
    </form>
  </section></main>
  <script src="assets/js/api.js"></script><script src="assets/js/app.js"></script>
</body></html>
