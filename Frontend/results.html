<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتیجه آزمون | سامانه سنجش</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="assets/css/dark.css">

</head>
<body data-role="student" data-active="results">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main-col">
    <div id="topbar-root" data-title="نتیجه آزمون"></div>
    <main class="content fade-in">
      <div class="page-head no-print">
        <div>
          <div class="breadcrumb">سامانه سنجش <span>/</span> <b>نتایج آزمون</b></div>
          <h1>نتایج آزمون</h1>
          <p class="text-soft text-sm mt-8">نمره بخش تستی پس از ثبت نهایی نمایش داده می‌شود؛ پاسخ‌های صحیح و نمره نهایی پس از انتشار رسمی استاد یا مدیر دپارتمان قابل مشاهده است.</p>
        </div>
        <div class="flex gap-8"><button class="btn btn-primary" id="publishExamResults" hidden>انتشار نتایج برای دانشجویان</button><button class="btn btn-outline" id="unpublishExamResults" hidden>لغو انتشار نتایج</button><button class="btn btn-outline" onclick="window.print()">چاپ / ذخیره PDF</button></div>
      </div>
      <div id="resultStudentInfo" class="text-soft text-sm mt-16" hidden></div>
      <div id="submissionPdfBox" class="card card-pad mt-24" hidden></div>
      <div id="essayGradingBox" class="card card-pad mt-24" hidden></div>
      <div class="card card-pad mt-24">
        <div class="section-title"><h3>سوابق و جزئیات نتایج</h3></div>
        <div class="table-wrap">
          <table class="dt">
            <thead><tr><th>#</th><th>آزمون</th><th>دانشجو</th><th>وضعیت</th><th>نمره</th></tr></thead>
            <tbody><tr><td colspan="5" style="text-align:center;padding:28px">در حال دریافت اطلاعات...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="assets/js/theme.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
